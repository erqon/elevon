name: Release Agent

on:
  push:
    tags: ["elevon-agent-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build-crate
        id: build
        with:
          name: elevon-agent
          version: ${{ inputs.version }}

      - uses: ./.github/actions/release-crate
        with:
          tag: ${{ steps.build.outputs.tag }}
          files: ${{ steps.build.outputs.archive }}
