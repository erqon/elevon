name: Release Deploy

on:
  push:
    tags: ["elevon-deploy-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.build.outputs.tag }}
      archive: ${{ steps.build.outputs.archive }}

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-crate
        id: build
        with:
          name: elevon-deploy
          version: ${{ inputs.version }}

  release:
    needs: [build-ubuntu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/release-crate
        with:
          tag: ${{ needs.build-ubuntu.outputs.tag }}
          name: ${{ needs.build-ubuntu.outputs.tag }}
          files: |
            ${{ needs.build-ubuntu.outputs.archive }}
