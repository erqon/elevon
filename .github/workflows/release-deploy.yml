name: Release Deploy

on:
  push:
    tags: ["elevon-deploy-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/crate-release
        with:
          name: elevon-deploy
          version: ${{ inputs.version }}
