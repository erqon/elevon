name: Build a crate
description: Composite action building crates

inputs:
  name:
    description: Crate name
    required: true
  binary:
    description: Binary name
    required: false
    default: ""
  version:
    description: Version number without the v prefix
    required: false
    default: ""

outputs:
  tag:
    description: Resolved Git tag
    value: ${{ steps.meta.outputs.tag }}
  archive:
    description: Built archive filename
    value: ${{ steps.resolve.outputs.archive }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Check its main branch
      shell: bash
      run: |
        git fetch origin main
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          test "${{ github.ref }}" = "refs/heads/main"
        else
          git merge-base --is-ancestor "${{ github.sha }}" origin/main
        fi

    - name: Resolve tag
      id: meta
      shell: bash
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          [ -n "${{ inputs.version }}" ] || { echo "missing version"; exit 1; }
          echo "tag=${{ inputs.name }}-v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
        else
          echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
        fi

    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-unknown-linux-musl

    - uses: mlugg/setup-zig@v2
      with:
        version: 0.16.0

    - name: Install cargo-zigbuild
      shell: bash
      run: cargo install cargo-zigbuild

    - uses: Swatinem/rust-cache@v2

    - name: Build
      shell: bash
      run: cargo zigbuild -p "${{ inputs.name }}" --release --target x86_64-unknown-linux-musl

    - name: Resolve build archive
      id: resolve
      shell: bash
      run: |
        CRATE="${{ inputs.name }}"
        TAG="${{ steps.meta.outputs.tag }}"
        VERSION="${{ inputs.version }}"
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION_TAG=v"${VERSION}"
        else
          VERSION_TAG="${TAG#*-}"
        fi

        ARCHIVE="$(./scripts/resolve-release-archive.sh "${CRATE}" "${VERSION_TAG}")"
        BIN="${ARCHIVE%.tar.gz}"

        echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
        echo "bin=$BIN" >> "$GITHUB_OUTPUT"

    - name: Package
      shell: bash
      run: |
        ARCHIVE="${{ steps.resolve.outputs.archive }}"
        BIN="${{ steps.resolve.outputs.bin }}"
        BINARY_NAME="${{ inputs.binary != '' && inputs.binary || inputs.name }}"

        cp "target/x86_64-unknown-linux-musl/release/${BINARY_NAME}" "$BIN"
        tar -czf "$ARCHIVE" "$BIN"
