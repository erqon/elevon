[workspace]
resolver = "3"
members = [
  "crates/aileron-agent", 
  "crates/aileron-auth",
  "crates/aileron-cli",
  "crates/aileron-config", 
  "crates/aileron-deploy",
  "crates/aileron-proxy",
  "crates/aileron-server",
]

[workspace.dependencies]
anyhow = "1"
axum = "0.8.9"
clap = { version = "4.6.2", features = ["color", "derive"] }
dotenvy = "0.15.7"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
thiserror = "2.0.19"
uuid = { version = "1.24.0", features = ["v7"] }

aileron-auth = { path = "./crates/aileron-auth" }
aileron-config = { path = "./crates/aileron-config" }
