name: project-name
image: project/project-name

elevon:
  dashboard: https://dash.example.com
  project: my-app
  agent:
    url: $AGENT_URL
    key: $AGENT_KEY

registry:
  server: ghcr.io
  username: $GHCR_USERNAME
  password: $GHCR_PASSWORD

routing:
  domain: app.example.com
  port: 3000
  tls:
    cert: $TLS_CERT
    key: $TLS_KEY

build:
  path: ./dev
  dockerfile: ./Dockerfile.dev

env:
  vars:
    PORT: 3000
    API_URL: $BASE_API_URL
  inherit:
    - DATABASE_URL

apps:
  api: {}                          # → apps/api.app.yml (auto)
  worker:
    include: ./custom/worker.yml   # custom path
  web:
    role: worker

    runtime:
      role: web
      restart: unless-stopped
      memory_limit: 512mb
      cpu_limit: "1.0"

      healthcheck:
        path: /healthz
        interval: 5s
        timeout: 2s
        retries: 3
