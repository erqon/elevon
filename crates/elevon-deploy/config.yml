name: project-name
image: project/project-name

elevon:
  dashboard: https://dash.example.com
  project: my-app

registry:
  server: ghcr.io
  username: $GHCR_USERNAME
  password: $GHCR_PASSWORD

routing:
  domain: app.example.com
  port: 3000

env:
  vars:
    PORT: 3000
    API_URL: $BASE_API_URL
  inherit:
    - DATABASE_URL

apps:
  api: {}                          # → apps/api.app.yml (auto)
  worker:
    include: ./custom/worker.yml   # custom path
  web:
    image: project/web             # fully inline, no file

    build:
      path: ./dev
      dockerfile: ./Dockerfile.dev

    routing:
      domain: app.example.com
      port: 3000

    runtime:
      restart: unless-stopped
      memory_limit: 512mb
      cpu_limit: "1.0"

      healthcheck:
        path: /healthz
        interval: 5s
        timeout: 2s
        retries: 3

servers:
  - host: 10.0.0.5
    role: web

  - host: 10.0.0.6
    role: web
